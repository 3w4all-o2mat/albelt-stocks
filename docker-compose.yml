services:
  app:
    image: ${IMAGE:-albelt-stocks}:${TAG:-latest}
    container_name: albelt-stocks
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    labels:
      - "com.albelt-stocks.commit=${COMMIT:-unknown}"
      - "com.albelt-stocks.deployed-at=${DEPLOYED_AT:-unknown}"
    # Mount the host's ./public/ folder so static assets (logo, favicon, etc.)
    # are served from the VPS filesystem instead of being baked into the image.
    # The image still ships an empty /app/public/ as a safety net.
    volumes:
      - ./public:/app/public
    networks:
      - existing_net
networks:
  existing_net:
    external: true
    name: odoo-network   # the exact network name from step 1