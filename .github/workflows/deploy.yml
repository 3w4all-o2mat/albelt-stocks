name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual trigger from the Actions tab

env:
  IMAGE_NAME: albelt-stocks
  VPS_DEPLOY_DIR: /home/ubuntu/albelt-stocks
  VPS_PORT: 3000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # GitHub deprecates Node 20 on runners. The runner already ships Node 24,
      # and this workflow only uses Docker + SSH (no JS), so the deprecation
      # notice is informational. We acknowledge it explicitly to silence the
      # warning per https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      ACTIONS_NODE_VERSION: "22"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Speed up rebuilds by caching layers in GitHub Actions cache.
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true                 # load into the runner's Docker daemon
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists on VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "mkdir -p ${{ env.VPS_DEPLOY_DIR }} && echo OK"

      - name: Upload compose + deploy script to VPS
        run: |
          scp ./docker-compose.yml ./scripts/deploy.sh ./.env.production \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.VPS_DEPLOY_DIR }}/
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "chmod +x ${{ env.VPS_DEPLOY_DIR }}/deploy.sh"

      - name: Transfer image (streamed, no artifact storage)
        run: |
          docker save \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.IMAGE_NAME }}:latest \
            | gzip | ssh -o StrictHostKeyChecking=accept-new \
                ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
                "gunzip | docker load"

      - name: Run deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "NEW_IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }} \
               NEW_TAG=${{ github.sha }} \
               PORT=${{ env.VPS_PORT }} \
               bash ${{ env.VPS_DEPLOY_DIR }}/deploy.sh"
